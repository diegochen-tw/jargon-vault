[pytest]
testpaths = tests
# ⚠ 沒有這一行,裸 `pytest`(README 與 ci.yml 都是這樣跑)會在載入 tests/conftest.py
# 時 ModuleNotFoundError: No module named 'app'。理由:`python -m pytest` 會把 CWD
# 放進 sys.path,裸 `pytest` 不會;而 conftest.py 在 tests/ 底下,pytest 的 prepend
# 模式只會把 tests/ 加進去,加不到 repo 根。本專案刻意不做成可安裝套件(沒有
# pyproject.toml,見 README 的「no build step」),所以由這裡把根目錄補上。
pythonpath = .
