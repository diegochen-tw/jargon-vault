# 直接拉已發佈的 image 跑,不需要 clone 原始碼、不需要在機器上 build。
#
#   mkdir jargon-vault && cd jargon-vault
#   curl -O https://raw.githubusercontent.com/diegochen-tw/jargon-vault/main/docker-compose.ghcr.yml
#   curl -o .env.docker https://raw.githubusercontent.com/diegochen-tw/jargon-vault/main/.env.docker.example
#   docker compose -f docker-compose.ghcr.yml up -d
#
# 要從原始碼 build 請改用同目錄的 docker-compose.yml(`docker compose up -d --build`)。
# 兩檔的 volume 名稱刻意相同(gv-data):同一個目錄下 compose 的 project 名一樣,
# 所以從 build 換成 pull(或反過來)資料不會不見。
# ⚠ 這兩個檔的 ports / env_file / volumes / restart 是重複的;改了一邊記得改另一邊。
services:
  app:
    # 正式使用建議釘死版本,例如:GV_VERSION=0.9.0 docker compose -f docker-compose.ghcr.yml up -d
    image: ghcr.io/diegochen-tw/jargon-vault:${GV_VERSION:-latest}
    container_name: jargon-vault
    # 對外埠可用 HOST_PORT 覆寫(容器內固定 8787)。
    ports:
      - "${HOST_PORT:-8787}:8787"
    # 用短格式(字串清單)才相容較舊的 Compose(如 Synology Container Manager)。
    # 注意:短格式要求 .env.docker 一定要存在 → 先 cp .env.docker.example .env.docker
    env_file:
      - .env.docker
    # 具名 volume 存放所有使用者資料 / 索引 / session 金鑰;一鍵重置就是清掉它。
    volumes:
      - gv-data:/data
    restart: unless-stopped

volumes:
  gv-data:
